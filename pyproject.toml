[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pure-gaze-typing"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy>=1.24,<2",
  "scikit-learn>=1.3,<2",
  "opencv-python>=4.8,<5",
  "PyQt6>=6.5,<7",
  "eyetrax==0.4.0",
  "mediapipe>=0.10,<0.11",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-qt>=4.4,<5",
  "PyInstaller>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
